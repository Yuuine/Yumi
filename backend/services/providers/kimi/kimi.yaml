# Kimi moonshot-v1 系列模型配置
# 旧版对话模型，支持标准参数

model:
  name: "moonshot-v1-auto"
  provider: "kimi"
  description: "Kimi moonshot-v1 系列模型，自动上下文"

api:
  endpoint_suffix: "/v1/chat/completions"
  auth_type: "bearer"

request:
  defaults:
    temperature: 0.0
    max_tokens: 4096
    top_p: 1.0
    n: 1
    presence_penalty: 0
    frequency_penalty: 0
    response_format:
      type: "text"
    tool_choice: "auto"

  supported_fields:
    - temperature
    - max_tokens
    - top_p
    - n
    - presence_penalty
    - frequency_penalty
    - response_format
    - stop
    - stream
    - stream_options
    - tools
    - tool_choice

response:
  content_field: "choices[0].message.content"
  reasoning_field: null

stream:
  format: "sse"
  done_signal: "[DONE]"
  content_field: "choices[0].delta.content"
