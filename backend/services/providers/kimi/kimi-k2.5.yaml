# Kimi K2.5 模型配置
# 最新智能模型，支持思考模式，参数受限
# TODO: 多模态能力 - 支持图片和视频理解 (image_url, video_url)

model:
  name: "kimi-k2.5"
  provider: "kimi"
  description: "Kimi K2.5 智能模型，支持深度思考模式"

api:
  endpoint_suffix: "/v1/chat/completions"
  auth_type: "bearer"

request:
  defaults:
    max_completion_tokens: 32768
    response_format:
      type: "text"
    tool_choice: "auto"

  unsupported_fields:
    - temperature
    - top_p
    - n
    - presence_penalty
    - frequency_penalty
    - logprobs
    - top_logprobs

  supported_fields:
    - max_completion_tokens
    - response_format
    - stop
    - stream
    - stream_options
    - tools
    - tool_choice
    - thinking

  special:
    thinking:
      supported: true
      type: "object"
      values:
        - "enabled"
        - "disabled"
      default_on: true
    # TODO: 多模态支持 - content 字段支持 image_url 和 video_url 类型

response:
  content_field: "choices[0].message.content"
  reasoning_field: null

stream:
  format: "sse"
  done_signal: "[DONE]"
  content_field: "choices[0].delta.content"
